server:
  port: 8081

spring:
  application:
    name: distributed-job-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO